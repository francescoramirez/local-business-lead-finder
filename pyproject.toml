[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-business-lead-finder"
version = "0.4.0"
description = "Cost-aware Python CLI and desktop app for discovering and prioritizing local business leads using Google Places API."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "FrancescoRamirezC" }]
keywords = ["leads", "local-business", "google-places", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = [
    "platformdirs>=4.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
gui = [
    "PySide6-Essentials>=6.6.0",
]
legacy = [
    "playwright>=1.44.0",
]

[project.scripts]
leadfinder = "leadfinder.cli:app"

[project.urls]
Homepage = "https://github.com/francescoramirez/local-business-lead-finder"
Issues = "https://github.com/francescoramirez/local-business-lead-finder/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["leadfinder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
exclude = ["legacy", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/leadfinder/cli.py" = ["B008"]
"src/leadfinder/gui/*.py" = ["B008"]

[tool.mypy]
python_version = "3.10"
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
files = ["src/leadfinder"]
